name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pinned: unpinned ruff drifts as new rules ship (0.17.x flags 100+
      # pre-existing patterns). Bump deliberately after clearing new debt.
      - run: pip install ruff==0.15.20 pytest
      - run: |
          if ls scripts/requirements*.txt 2>/dev/null; then
            pip install -r scripts/requirements.txt
          fi
      - run: ruff check .
      - run: pytest --tb=short || true
